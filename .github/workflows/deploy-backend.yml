name: Deploy backend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: npm test --if-present

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: ~/deploy-backend.sh
